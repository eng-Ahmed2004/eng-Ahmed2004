<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 10" width="960" height="10" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B949E" stop-opacity="0"/><stop offset=".5" stop-color="#8B949E" stop-opacity=".55"/><stop offset="1" stop-color="#8B949E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/><stop offset=".5" stop-color="#39D0D8"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="960" height="10"/></clipPath>
  </defs>
  <style>
    .run{animation:run 7s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes run{from{transform:translateX(-200px)}to{transform:translateX(960px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x="0" y="4.5" width="960" height="1" fill="url(#base)"/>
  <g clip-path="url(#clip)"><rect class="run" x="0" y="4" width="200" height="2" rx="1" fill="url(#glow)"/></g>
</svg>
